# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Uso: winget configure -f setup.dsc.yaml --accept-configuration-agreements --disable-interactivity

properties:
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git
        allowPrerelease: true
      settings:
        id: Git.Git
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: pwsh7
      directives:
        description: Install PowerShell 7
        allowPrerelease: true
      settings:
        id: Microsoft.PowerShell
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wezterm
      directives:
        description: Install WezTerm
        allowPrerelease: true
      settings:
        id: wez.wezterm
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: neovim
      directives:
        description: Install Neovim
        allowPrerelease: true
      settings:
        id: Neovim.Neovim
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: lazygit
      directives:
        description: Install Lazygit
        allowPrerelease: true
      settings:
        id: JesseDuffield.lazygit
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: nvm
      directives:
        description: Install NVM for Windows
        allowPrerelease: true
      settings:
        id: CoreyButler.NVMforWindows
        source: winget

    # Instala y activa la LTS de Node apenas se instala nvm
    - resource: PSDscResources/Script
      id: nodeLts
      dependsOn:
        - nvm
      directives:
        description: Install and activate Node LTS via nvm
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "(Get-Command node -ErrorAction SilentlyContinue) -ne $null"
        SetScript: |
          $ErrorActionPreference = 'Continue'
          $env:NVM_HOME = Join-Path $env:LOCALAPPDATA 'nvm'
          $env:NVM_SYMLINK = 'C:\nvm4w\nodejs'
          $nvmExe = Join-Path $env:NVM_HOME 'nvm.exe'
          & $nvmExe install lts
          & $nvmExe use lts

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: croc
      directives:
        description: Install croc
        allowPrerelease: true
      settings:
        id: schollz.croc
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: chezmoi
      directives:
        description: Install chezmoi
        allowPrerelease: true
      settings:
        id: twpayne.chezmoi
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: treeSitterCli
      directives:
        description: Install tree-sitter-cli
        allowPrerelease: true
      settings:
        id: tree-sitter.tree-sitter-cli
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: starship
      directives:
        description: Install Starship
        allowPrerelease: true
      settings:
        id: Starship.Starship
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: coreutils
      directives:
        description: Install Coreutils for Windows
        allowPrerelease: true
      settings:
        id: Microsoft.Coreutils
        source: winget

    # Usados por el picker de archivos/grep de snacks.nvim
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fd
      directives:
        description: Install fd
        allowPrerelease: true
      settings:
        id: sharkdp.fd
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ripgrep
      directives:
        description: Install ripgrep
        allowPrerelease: true
      settings:
        id: BurntSushi.ripgrep.MSVC
        source: winget

    # Compilador C (mingw-w64), necesario para que nvim-treesitter compile los parsers en Windows
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mingw
      directives:
        description: Install WinLibs mingw-w64 GCC
        allowPrerelease: true
      settings:
        id: BrechtSanders.WinLibs.POSIX.UCRT
        source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: zoxide
      directives:
        description: Install zoxide
        allowPrerelease: true
      settings:
        id: ajeetdsouza.zoxide
        source: winget

    # Neovim (y cualquier otra herramienta que respete XDG) en Windows busca su
    # config en %LOCALAPPDATA% por defecto; esto la apunta a ~/.config, la misma
    # carpeta que ya gestiona chezmoi (dot_config) tanto en WSL como en Windows.
    - resource: PSDscResources/Script
      id: xdgConfigHome
      directives:
        description: Set XDG_CONFIG_HOME to ~/.config
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "[Environment]::GetEnvironmentVariable('XDG_CONFIG_HOME', 'User') -eq (Join-Path $env:USERPROFILE '.config')"
        SetScript: "[Environment]::SetEnvironmentVariable('XDG_CONFIG_HOME', (Join-Path $env:USERPROFILE '.config'), 'User')"

    # Herdr usa $SHELL para decidir qué ejecutable abrir en paneles nuevos; sin
    # esto cae a powershell.exe (5.1) en vez de pwsh (7). Se setea solo como
    # variable de usuario de Windows para no pisar $SHELL en WSL, donde herdr
    # ya respeta fish (shell de login configurado en setup.sh).
    - resource: PSDscResources/Script
      id: shellEnv
      dependsOn:
        - pwsh7
      directives:
        description: Set SHELL to pwsh so Herdr defaults to PowerShell 7 on Windows
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "[Environment]::GetEnvironmentVariable('SHELL', 'User') -eq 'pwsh.exe'"
        SetScript: "[Environment]::SetEnvironmentVariable('SHELL', 'pwsh.exe', 'User')"

    # Apunta CC al gcc de WinLibs y lo agrega al PATH de usuario, para que
    # tree-sitter build (usado por nvim-treesitter) lo encuentre en vez de cl.exe.
    - resource: PSDscResources/Script
      id: gccPath
      dependsOn:
        - mingw
      directives:
        description: Set CC to WinLibs gcc and add it to PATH
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: |
          $bin = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages\BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe\mingw64\bin'
          $ccOk = [Environment]::GetEnvironmentVariable('CC', 'User') -eq (Join-Path $bin 'gcc.exe')
          $pathOk = ([Environment]::GetEnvironmentVariable('Path', 'User')) -like "*$bin*"
          $ccOk -and $pathOk
        SetScript: |
          $bin = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages\BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe\mingw64\bin'
          [Environment]::SetEnvironmentVariable('CC', (Join-Path $bin 'gcc.exe'), 'User')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$bin*") {
            [Environment]::SetEnvironmentVariable('Path', "$userPath;$bin", 'User')
          }

    # Claude Code no tiene paquete winget oficial, se instala con su script
    - resource: PSDscResources/Script
      id: claudeCode
      directives:
        description: Install Claude Code
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "(Get-Command claude -ErrorAction SilentlyContinue) -ne $null"
        SetScript: "$ErrorActionPreference = 'Continue'; irm https://claude.ai/install.ps1 | iex"

    # Herdr no tiene paquete winget oficial, se instala con su script (beta en Windows)
    - resource: PSDscResources/Script
      id: herdr
      directives:
        description: Install Herdr
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "(Get-Command herdr -ErrorAction SilentlyContinue) -ne $null"
        SetScript: "$ErrorActionPreference = 'Continue'; powershell -ExecutionPolicy Bypass -c \"irm https://herdr.dev/install.ps1 | iex\""

    # Aplica los dotfiles de Windows (wezterm.lua, perfil de PowerShell) via chezmoi.
    - resource: PSDscResources/Script
      id: dotfiles
      dependsOn:
        - chezmoi
      directives:
        description: Apply dotfiles with chezmoi
      settings:
        GetScript: "@{ Result = '' }"
        TestScript: "Test-Path (Join-Path $env:USERPROFILE '.config\\wezterm\\wezterm.lua')"
        SetScript: |
          $ErrorActionPreference = 'Continue'
          $sourceDir = Join-Path $env:USERPROFILE '.local\share\chezmoi'
          if (Test-Path (Join-Path $sourceDir '.git')) {
            chezmoi apply
          } else {
            chezmoi init --apply https://github.com/adrianlaracore/init.git
          }

  configurationVersion: 0.2.0
